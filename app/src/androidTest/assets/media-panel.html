<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
<input type="file" id="file"><button id="save">Download</button>
<button id="mic">Record</button><button id="map">Map</button><textarea id="text"></textarea><a href="https://aily.feishu.cn/docx/device-fixture">Document link</a>
<style>body{margin:0}button,input,textarea,a{display:block;width:100%;height:54px}</style>
<script>
const state = {};
const report = () => parent.postMessage({fixture:state}, 'https://xiaoli-droid.cyeam.com');
let file, endpoint;
const player = new Audio();
addEventListener('message', e => {
  if (e.source !== parent || e.origin !== 'https://xiaoli-droid.cyeam.com') return;
  if (e.data === 'status') report();
  if (e.data.accept) { document.querySelector('input').accept = e.data.accept; endpoint = e.data.endpoint; }
});
document.querySelector('input').onchange = async e => {
  file = e.target.files[0];
  if (!file) return;
  state.name = file.name;
  try {
    const bytes = await file.arrayBuffer();
    const hash = await crypto.subtle.digest('SHA-256', bytes);
    const response = await fetch(endpoint, {method:'POST', body:file, credentials:'omit'});
    if (!response.ok) throw Error('upload '+response.status);
    file = new File([await response.blob()], file.name, {type:file.type});
    state.hash = Array.from(new Uint8Array(hash), n=>n.toString(16).padStart(2,'0')).join('');
    if (file.type.startsWith('image/')) {
      const img = new Image(); img.src = URL.createObjectURL(file); await img.decode(); state.imageWidth = img.naturalWidth;
    }
  } catch(e){state.error=String(e)}
  report();
};
document.querySelector('#save').onclick = () => {
  if (file.type.startsWith('audio/')) {
    player.src = URL.createObjectURL(file);
    player.ontimeupdate=()=>{state.audioReplyPlayed=player.currentTime;report()};
    player.play().catch(e=>{state.error=String(e);report()});
  }
  const a = document.createElement('a');
  a.href=URL.createObjectURL(file); a.download='reply-'+file.name;
  a.click(); URL.revokeObjectURL(a.href);
};
document.querySelector('#mic').onclick = async () => {
  try {
    state.recording="request"; report();
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    state.recording="granted"; report();
    const recorder = new MediaRecorder(stream), chunks=[];
    recorder.ondataavailable=e=>chunks.push(e.data);
    recorder.onstop=async () => {
      stream.getTracks().forEach(t=>t.stop());
      const clip=new Blob(chunks,{type:recorder.mimeType}); state.recordBytes=clip.size;
      player.src=URL.createObjectURL(clip);
      player.onended=()=>{state.played=player.currentTime;report()};
      try {await player.play()} catch(e){state.error=String(e)}
      report();
    };
    recorder.start(); setTimeout(()=>recorder.stop(),900);
  } catch(e){state.error=String(e);report()}
};
document.querySelector('#map').onclick=()=>window.open('https://www.openstreetmap.org/?mlat=39&mlon=116','_blank');
document.querySelector('#text').oninput=e=>{state.text=e.target.value;report()};
report();
</script>
